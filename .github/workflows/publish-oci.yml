name: Publish OCI image

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Normalize version
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/jostophe-021/mcp-cross-model-delegation:${{ steps.version.outputs.value }}
          sbom: true
          labels: |
            io.modelcontextprotocol.server.name=io.github.Jostophe-021/mcp-cross-model-delegation
            org.opencontainers.image.source=https://github.com/Jostophe-021/mcp-cross-model-delegation
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.description=Bounded cross-model delegation and evaluation

name: Publish OCI image

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.1.0
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/jostophe-021/mcp-cross-model-delegation:0.1.0
          labels: |
            io.modelcontextprotocol.server.name=io.github.Jostophe-021/mcp-cross-model-delegation
            org.opencontainers.image.source=https://github.com/Jostophe-021/mcp-cross-model-delegation
            org.opencontainers.image.version=0.1.0

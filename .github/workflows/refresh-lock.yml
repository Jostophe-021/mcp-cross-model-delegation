name: Refresh V1 dependency lock
on:
  push:
    branches: [feature/v1-stable-routing]
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v1-stable-routing
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.9"
      - run: uv lock
      - name: Commit lockfile if changed
        run: |
          if ! git diff --quiet -- uv.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add uv.lock
            git commit -m "Lock V1 dependencies"
            git push origin HEAD:feature/v1-stable-routing
          fi
